<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>微圈 · MiniSocial</title>
<style>
  :root{--bg:#15202b;--card:#1e2b38;--line:#2f3f4e;--txt:#e7ecef;--mut:#8aa0b2;--accent:#1d9bf0;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt)}
  header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:5}
  header h1{font-size:18px;margin:0}
  #me{font-size:13px;color:var(--mut)}
  .wrap{max-width:600px;margin:0 auto;padding:0 12px}
  button{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:8px 16px;font-size:14px;cursor:pointer;white-space:nowrap}
  button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
  button:disabled{opacity:.5;cursor:default}
  input,textarea{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;font-size:14px;margin:6px 0}
  textarea{resize:vertical;min-height:60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
  .post-media img,.post-media video{max-width:100%;border-radius:10px;margin-top:8px;display:block}
  .row{display:flex;gap:16px;align-items:center;color:var(--mut);font-size:13px;margin-top:10px}
  .row span{cursor:pointer;user-select:none}
  .row span.on{color:var(--accent)}
  .name{font-weight:600}
  .time{color:var(--mut);font-size:12px;margin-left:6px}
  .mut{color:var(--mut);font-size:13px}
  .comment{border-top:1px solid var(--line);padding-top:8px;margin-top:8px;font-size:14px}
  .hide{display:none !important}
  .tabbar{display:flex;margin:12px 0;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .tabbar button{flex:1;border-radius:0;border:0;padding:10px 0;white-space:nowrap}
  .tabbar button.ghost{background:transparent;color:var(--mut)}
  #authBtn{width:100%;margin-top:6px}
  .fol{white-space:nowrap;flex-shrink:0}
  .head{display:flex;align-items:center;gap:6px}
  .head .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  a{color:var(--accent)}
  .err{color:#f4576b;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>微圈</h1>
  <div><span id="me"></span> <button id="logoutBtn" class="ghost hide">退出</button></div>
</header>

<div class="wrap">

  <!-- 登录 / 注册 -->
  <section id="auth" class="card">
    <div class="tabbar">
      <button id="tabLogin">登录</button>
      <button id="tabSignup" class="ghost">注册</button>
    </div>
    <input id="username" placeholder="用户名（字母、数字、下划线，2–20 位）" autocomplete="username" autocapitalize="off" />
    <input id="password" type="password" placeholder="密码（至少 6 位）" autocomplete="current-password" />
    <button id="authBtn">登录</button>
    <div id="authErr" class="err"></div>
    <div class="mut">只要用户名和密码，不需要邮箱。密码忘了无法找回，请记好。</div>
  </section>

  <!-- 发帖 -->
  <section id="compose" class="card hide">
    <textarea id="newContent" placeholder="说点什么…"></textarea>
    <input id="newMedia" type="file" accept="image/*,video/*" />
    <div style="text-align:right"><button id="postBtn">发布</button></div>
    <div id="postErr" class="err"></div>
  </section>

  <!-- 时间线 -->
  <div id="feedTabs" class="tabbar hide">
    <button id="tabAll">全部</button>
    <button id="tabFollow" class="ghost">关注</button>
  </div>
  <section id="feed"></section>
  <div id="empty" class="mut hide" style="text-align:center;padding:20px">还没有帖子，来发第一条。</div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// ====== 改这两行为你自己的 Supabase 项目 ======
const SUPABASE_URL = 'https://oolvxadtnhiteenpvmbd.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_NHmJf-R_SwYWaxZH3J75fg_ebCj7PkM';
// ==============================================

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = s => document.querySelector(s);
let me = null;            // 当前用户 {id, username}
let mode = 'login';
let feedMode = 'all';
let myFollows = new Set();

// ---------- 登录相关 UI ----------
$('#tabLogin').onclick = () => setMode('login');
$('#tabSignup').onclick = () => setMode('signup');
function setMode(m){
  mode = m;
  $('#tabLogin').className = m==='login'?'':'ghost';
  $('#tabSignup').className = m==='signup'?'':'ghost';
  $('#authBtn').textContent = m==='login'?'登录':'注册';
}

const toEmail = u => u.toLowerCase() + '@example.com';
$('#authBtn').onclick = async () => {
  $('#authErr').textContent = '';
  const username = $('#username').value.trim();
  const password = $('#password').value;
  if(!/^[A-Za-z0-9_]{2,20}$/.test(username)){ $('#authErr').textContent='用户名只能用字母、数字、下划线，2–20 位'; return; }
  if(password.length < 6){ $('#authErr').textContent='密码至少 6 位'; return; }
  const email = toEmail(username);
  $('#authBtn').disabled = true;
  try{
    if(mode==='signup'){
      localStorage.setItem('pending_username', username);
      const { data, error } = await sb.auth.signUp({ email, password });
      if(error){ $('#authErr').textContent = /registered|exists/i.test(error.message) ? '用户名已被占用' : error.message; return; }
      if(data.user && data.session){
        await sb.from('profiles').insert({ id:data.user.id, username }).then(()=>{},()=>{});
      }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if(error){ $('#authErr').textContent = /invalid/i.test(error.message) ? '用户名或密码不对' : error.message; return; }
    }
  } finally { $('#authBtn').disabled = false; }
};

$('#tabAll').onclick=()=>{feedMode='all';$('#tabAll').className='';$('#tabFollow').className='ghost';loadFeed();};
$('#tabFollow').onclick=()=>{feedMode='follow';$('#tabFollow').className='';$('#tabAll').className='ghost';loadFeed();};

$('#logoutBtn').onclick = async () => { await sb.auth.signOut(); location.reload(); };

// ---------- 会话 ----------
sb.auth.onAuthStateChange(async (_e, session) => { await boot(session); });
(async ()=>{ const { data } = await sb.auth.getSession(); await boot(data.session); })();

async function boot(session){
  if(!session){ me=null; showLoggedOut(); return; }
  // 确保有 profile
  let { data: prof } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  if(!prof){
    const username = localStorage.getItem('pending_username') || ('user'+session.user.id.slice(0,6));
    await sb.from('profiles').insert({ id:session.user.id, username }).then(()=>{},()=>{});
    ({ data: prof } = await sb.from('profiles').select('*').eq('id', session.user.id).single());
  }
  me = prof || { id:session.user.id, username:'me' };
  showLoggedIn();
  await loadFeed();
}

function showLoggedOut(){
  $('#auth').classList.remove('hide');
  $('#compose').classList.add('hide');
  $('#feedTabs').classList.add('hide');
  $('#logoutBtn').classList.add('hide');
  $('#me').textContent='';
  $('#feed').innerHTML='';
}
function showLoggedIn(){
  $('#auth').classList.add('hide');
  $('#compose').classList.remove('hide');
  $('#feedTabs').classList.remove('hide');
  $('#logoutBtn').classList.remove('hide');
  $('#me').textContent='@'+me.username;
}

// ---------- 发帖 ----------
$('#postBtn').onclick = async () => {
  $('#postErr').textContent='';
  const content = $('#newContent').value.trim();
  const file = $('#newMedia').files[0];
  if(!content && !file){ $('#postErr').textContent='写点字或选个文件'; return; }
  $('#postBtn').disabled=true;
  try{
    let media_url=null, media_type=null;
    if(file){
      if(file.size > 50*1024*1024){ throw new Error('文件超过 50 MB'); }
      media_type = file.type.startsWith('video')?'video':'image';
      const path = `${me.id}/${Date.now()}_${file.name.replace(/[^\w.\-]/g,'_')}`;
      const { error:upErr } = await sb.storage.from('media').upload(path, file);
      if(upErr) throw upErr;
      media_url = sb.storage.from('media').getPublicUrl(path).data.publicUrl;
    }
    const { error } = await sb.from('posts').insert({ user_id:me.id, content, media_url, media_type });
    if(error) throw error;
    $('#newContent').value=''; $('#newMedia').value='';
    await loadFeed();
  }catch(e){ $('#postErr').textContent=e.message||String(e); }
  finally{ $('#postBtn').disabled=false; }
};

// ---------- 时间线 ----------
async function loadFeed(){
  const { data: f } = await sb.from('follows').select('following_id').eq('follower_id',me.id);
  myFollows = new Set((f||[]).map(x=>x.following_id));
  let q = sb.from('posts')
    .select('id,content,media_url,media_type,created_at,user_id,profiles!posts_user_id_fkey(username)')
    .order('created_at',{ascending:false})
    .limit(50);
  if(feedMode==='follow') q = q.in('user_id', [...myFollows, me.id]);
  const { data: posts, error } = await q;
  if(error){ $('#feed').innerHTML='<div class="err">'+error.message+'</div>'; return; }
  const ids = posts.map(p=>p.id);
  const likeMap={}, myLikes=new Set();
  if(ids.length){
    const { data: likes } = await sb.from('likes').select('post_id,user_id').in('post_id',ids);
    (likes||[]).forEach(l=>{ likeMap[l.post_id]=(likeMap[l.post_id]||0)+1; if(l.user_id===me.id) myLikes.add(l.post_id); });
  }
  $('#empty').classList.toggle('hide', posts.length>0);
  $('#feed').innerHTML = posts.map(p=>render(p, likeMap[p.id]||0, myLikes.has(p.id))).join('');
  posts.forEach(p=>wire(p));
}

function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function when(t){ const d=new Date(t); return d.toLocaleString(); }

function render(p, likeCount, liked){
  let media='';
  if(p.media_url && p.media_type==='image') media=`<div class="post-media"><img src="${p.media_url}" loading="lazy"></div>`;
  if(p.media_url && p.media_type==='video') media=`<div class="post-media"><video src="${p.media_url}" controls></video></div>`;
  return `<div class="card" data-id="${p.id}">
    <div class="head"><span class="who"><span class="name">@${esc(p.profiles?.username||'匿名')}</span><span class="time">${when(p.created_at)}</span></span>${p.user_id!==me.id?`<button class="ghost fol" style="padding:4px 12px;font-size:12px">${myFollows.has(p.user_id)?'已关注':'+ 关注'}</button>`:''}</div>
    <div>${esc(p.content)}</div>
    ${media}
    <div class="row">
      <span class="like ${liked?'on':''}">♥ <b class="lc">${likeCount}</b></span>
      <span class="cmt">💬 评论</span>
      ${p.user_id===me.id?'<span class="del">🗑 删除</span>':''}
    </div>
    <div class="comments hide"></div>
  </div>`;
}

function wire(p){
  const el = $(`.card[data-id="${p.id}"]`);
  el.querySelector('.like').onclick = async (ev)=>{
    const on = ev.currentTarget.classList.contains('on');
    const b = el.querySelector('.lc');
    if(on){ await sb.from('likes').delete().eq('post_id',p.id).eq('user_id',me.id); ev.currentTarget.classList.remove('on'); b.textContent=Math.max(0,+b.textContent-1); }
    else { await sb.from('likes').insert({post_id:p.id,user_id:me.id}); ev.currentTarget.classList.add('on'); b.textContent=+b.textContent+1; }
  };
  const fol = el.querySelector('.fol');
  if(fol) fol.onclick = async ()=>{
    if(myFollows.has(p.user_id)){ await sb.from('follows').delete().eq('follower_id',me.id).eq('following_id',p.user_id); myFollows.delete(p.user_id); }
    else { await sb.from('follows').insert({follower_id:me.id,following_id:p.user_id}); myFollows.add(p.user_id); }
    document.querySelectorAll('.fol').forEach(()=>{}); loadFeed();
  };
  const del = el.querySelector('.del');
  if(del) del.onclick = async ()=>{ if(confirm('删除这条？')){ await sb.from('posts').delete().eq('id',p.id); el.remove(); } };
  el.querySelector('.cmt').onclick = ()=> toggleComments(p.id, el);
}

async function toggleComments(postId, el){
  const box = el.querySelector('.comments');
  if(!box.classList.contains('hide')){ box.classList.add('hide'); return; }
  box.classList.remove('hide');
  const { data } = await sb.from('comments')
    .select('id,content,created_at,profiles(username)')
    .eq('post_id',postId).order('created_at',{ascending:true});
  box.innerHTML = (data||[]).map(c=>`<div class="comment"><span class="name">@${esc(c.profiles?.username||'匿名')}</span> ${esc(c.content)}<div class="time">${when(c.created_at)}</div></div>`).join('')
    + `<div class="comment"><input class="ci" placeholder="写评论…"><div style="text-align:right"><button class="cb">发送</button></div></div>`;
  box.querySelector('.cb').onclick = async ()=>{
    const v = box.querySelector('.ci').value.trim();
    if(!v) return;
    const { error } = await sb.from('comments').insert({post_id:postId,user_id:me.id,content:v});
    if(!error){ box.classList.add('hide'); toggleComments(postId, el); }
  };
}

setMode('login');
</script>
</body>
</html>
